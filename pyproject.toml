[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cropmandi-ai"
version = "0.1.0"
description = "CropMandi AI V1 data foundation for coffee and pepper"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["cropmandi*", "ingest*", "apps*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
