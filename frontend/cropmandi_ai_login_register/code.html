<body class="h-full bg-background font-body-md text-on-background antialiased flex flex-col md:flex-row overflow-hidden">
<!-- Suppressed navigation shells as this is a transactional/linear screen -->
<!-- Left/Top Section: Branding & Atmospheric Background -->
<div class="relative w-full md:w-1/2 h-48 md:h-full bg-texture bg-primary flex flex-col justify-end p-container-margin md:p-12 text-on-primary z-10" data-alt="A lush, detailed overhead view of an organic farm with terraced fields glowing in warm, early morning sunlight. The scene uses a rich palette of deep emerald greens, warm terracotta soil, and soft golden light, creating a premium 3D tactile aesthetic that feels both natural and technologically advanced. High-fidelity rendering with a subtle atmospheric mist overlay, emphasizing growth and intelligence.">
<div class="absolute inset-0 bg-gradient-to-t from-primary/90 to-primary/30 mix-blend-multiply"></div>
<div class="relative z-20 mt-auto">
<h1 class="font-headline-xl text-headline-xl text-on-primary mb-2 shadow-sm drop-shadow-md">CropMandi AI</h1>
<p class="font-body-lg text-body-lg text-primary-fixed-dim max-w-md">Agricultural Intelligence tailored for your farm's growth and prosperity.</p>
</div>
</div>
<!-- Right/Bottom Section: Authentication Canvas -->
<div class="flex-1 w-full md:w-1/2 h-full overflow-y-auto bg-surface flex flex-col items-center justify-center p-container-margin relative z-20 -mt-6 md:mt-0 rounded-t-[32px] md:rounded-t-none">
<!-- Language Selector -->
<div class="absolute top-6 right-6 md:top-8 md:right-8 z-30">
<button class="flex items-center gap-2 bg-surface-container-high px-4 py-2 rounded-full font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-variant transition-colors tactile-shadow-raised">
<span class="material-symbols-outlined text-[18px]">language</span>
                English
                <span class="material-symbols-outlined text-[18px]">expand_more</span>
</button>
</div>
<!-- Forms Container -->
<div class="w-full max-w-[420px] bg-surface-container-lowest rounded-[24px] p-8 tactile-shadow-raised relative" id="auth-container">
<p class="text-label-sm font-label-sm text-error mb-4 hidden" id="auth-message"></p>
<!-- Tab Navigation (Login / Register) -->
<div class="flex border-b border-outline-variant/30 mb-8 w-full">
<button class="flex-1 pb-3 text-center font-headline-md text-body-lg font-bold text-primary border-b-2 border-primary transition-all" id="tab-login" onclick="switchTab('login')">
                    Log In
                </button>
<button class="flex-1 pb-3 text-center font-headline-md text-body-lg text-on-surface-variant hover:text-primary transition-all" id="tab-register" onclick="switchTab('register')">
                    Register
                </button>
</div>
<!-- Login Form -->
<form class="space-y-6 block" id="form-login">
<div class="space-y-4">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="login-identifier">Phone Number or Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full bg-surface-container-low border border-transparent rounded-xl py-3 pl-12 pr-4 text-body-md text-on-background focus:border-primary focus:ring-1 focus:ring-primary soft-pocket transition-all outline-none placeholder-outline-variant" id="login-identifier" placeholder="Enter phone or email" type="text"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="login-password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-container-low border border-transparent rounded-xl py-3 pl-12 pr-4 text-body-md text-on-background focus:border-primary focus:ring-1 focus:ring-primary soft-pocket transition-all outline-none placeholder-outline-variant" id="login-password" placeholder="Enter password" type="password"/>
</div>
</div>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer">
<input class="rounded text-primary focus:ring-primary bg-surface-container-low border-outline-variant/50 w-5 h-5" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant text-[14px]">Remember me</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<button type="submit" id="btn-access-dashboard" class="w-full bg-primary text-on-primary font-headline-md text-body-lg rounded-xl py-4 tactile-shadow-raised hover:bg-primary-container hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center justify-center gap-2">
                    Access Dashboard
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Register Form (Hidden by default) -->
<form class="space-y-6 hidden" id="form-register">
<div class="space-y-4">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="reg-name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">badge</span>
<input class="w-full bg-surface-container-low border border-transparent rounded-xl py-3 pl-12 pr-4 text-body-md text-on-background focus:border-primary focus:ring-1 focus:ring-primary soft-pocket transition-all outline-none placeholder-outline-variant" id="reg-name" placeholder="e.g. Ramesh Kumar" type="text"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="reg-location">Farm Location</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">location_on</span>
<input class="w-full bg-surface-container-low border border-transparent rounded-xl py-3 pl-12 pr-4 text-body-md text-on-background focus:border-primary focus:ring-1 focus:ring-primary soft-pocket transition-all outline-none placeholder-outline-variant" id="reg-location" placeholder="Village, District" type="text"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="reg-crop">Primary Crop</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">grass</span>
<select class="w-full bg-surface-container-low border border-transparent rounded-xl py-3 pl-12 pr-10 text-body-md text-on-background focus:border-primary focus:ring-1 focus:ring-primary soft-pocket transition-all outline-none appearance-none" id="reg-crop">
<option disabled="" selected="" value="">Select main crop</option>
<option value="wheat">Wheat</option>
<option value="rice">Rice (Paddy)</option>
<option value="cotton">Cotton</option>
<option value="sugarcane">Sugarcane</option>
<option value="other">Other</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="reg-phone">Mobile Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">call</span>
<input class="w-full bg-surface-container-low border border-transparent rounded-xl py-3 pl-12 pr-4 text-body-md text-on-background focus:border-primary focus:ring-1 focus:ring-primary soft-pocket transition-all outline-none placeholder-outline-variant" id="reg-phone" placeholder="+91" type="tel"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="reg-email">Email (optional)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-surface-container-low border border-transparent rounded-xl py-3 pl-12 pr-4 text-body-md text-on-background focus:border-primary focus:ring-1 focus:ring-primary soft-pocket transition-all outline-none placeholder-outline-variant" id="reg-email" placeholder="Enter email" type="email"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="reg-password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-container-low border border-transparent rounded-xl py-3 pl-12 pr-4 text-body-md text-on-background focus:border-primary focus:ring-1 focus:ring-primary soft-pocket transition-all outline-none placeholder-outline-variant" id="reg-password" placeholder="Create a password" type="password"/>
</div>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-headline-md text-body-lg rounded-xl py-4 tactile-shadow-raised hover:bg-primary-container hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center justify-center gap-2" type="submit" id="btn-create-account">
                    Create Account
                    <span class="material-symbols-outlined">person_add</span>
</button>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant mt-4">
                    By registering, you agree to our <a class="text-primary hover:underline" href="#">Terms &amp; Privacy</a>.
                </p>
</form>
</div>
</div>
<script>
        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                loginForm.classList.add('block');
                registerForm.classList.add('hidden');
                registerForm.classList.remove('block');

                loginTab.classList.add('font-bold', 'text-primary', 'border-b-2', 'border-primary');
                loginTab.classList.remove('text-on-surface-variant');
                
                registerTab.classList.remove('font-bold', 'text-primary', 'border-b-2', 'border-primary');
                registerTab.classList.add('text-on-surface-variant');
            } else {
                registerForm.classList.remove('hidden');
                registerForm.classList.add('block');
                loginForm.classList.add('hidden');
                loginForm.classList.remove('block');

                registerTab.classList.add('font-bold', 'text-primary', 'border-b-2', 'border-primary');
                registerTab.classList.remove('text-on-surface-variant');
                
                loginTab.classList.remove('font-bold', 'text-primary', 'border-b-2', 'border-primary');
                loginTab.classList.add('text-on-surface-variant');
            }
        }
    </script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
</body></html>
